[build-system]
    requires      = ["setuptools>=69", "wheel"]
    build-backend = "setuptools.build_meta"

[project]
    name = "codectl"
    version = "0.2.0"
    description = "codectl backend - Ansible bridge"
    readme = "README.md"
    requires-python = ">=3.11"
    dependencies = [
        "pydantic>=2.0",
        "pyyaml>=6.0",
        "typer>=0.16.1",
        "pytest>=9.0",
        "types-pyyaml>=6.0.12.20250915",
        "ansible-core>=2.19.6",
]

    [project.scripts]
        codectl   = "main:app"
        run-tests = "pytest:main"

[tool.setuptools]
    py-modules = ["main", "ansible_bridge", "models"]

[tool.pytest.ini_options]
    pythonpath = ["."]

[tool.uv]
    package = true
